name: Publicar PokéLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar y preparar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verificar datos y funcionalidad
        run: npm test
      - name: Verificar sintaxis
        run: |
          node --check public/app.js
          node --check public/shared.mjs
          node --check public/team.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Publicar
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
